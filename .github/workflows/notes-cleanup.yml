name: Notes cleanup
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/components/NotesTab.tsx'
      - 'scripts/notes_cleanup.py'
      - '.github/workflows/notes-cleanup.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/notes_cleanup.py
      - run: |
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/utils/uiPrefs.ts src/utils/storage.ts src/index.css src/components/NotesTab.tsx
          git commit -m "Notes: collapse/remove sections, strip geo-pins and practicality" || echo nochange
          git push
