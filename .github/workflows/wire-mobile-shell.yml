name: Wire MobileShellNav
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wire-mobile-shell.yml'
      - 'src/components/MobileShellNav.tsx'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch DashboardView.tsx
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/components/DashboardView.tsx')
          text = p.read_text()
          if 'MobileShellNav' in text:
              print('Already wired in DashboardView')
              raise SystemExit(0)
          text = text.replace(
              "import { DashboardCharts } from './DashboardCharts';",
              "import { DashboardCharts } from './DashboardCharts';\nimport { MobileShellNav } from './MobileShellNav';",
              1,
          )
          old = """      ) : (
        <DashboardCharts trips={trips} categories={categories} />
      )}
    </main>
  );
};"""
          new = """      ) : (
        <DashboardCharts trips={trips} categories={categories} />
      )}

      <MobileShellNav
        active={activeDashTab === 'charts' ? 'charts' : 'trips'}
        onTrips={() => setActiveDashTab('trips')}
        onCharts={() => setActiveDashTab('charts')}
        onNewTrip={onNewTrip}
        onSettings={() => onOpenSettings && onOpenSettings()}
      />
    </main>
  );
};"""
          if old not in text:
              raise SystemExit('DashboardView anchor not found')
          p.write_text(text.replace(old, new, 1))
          print('Patched DashboardView')
          PY
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/components/DashboardView.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Wire MobileShellNav into DashboardView (app bottom nav)"
            git push
          fi
