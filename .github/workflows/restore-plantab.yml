name: Restore PlanTab
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/restore_plantab.py'
      - '.github/workflows/restore-plantab.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_plantab.py
      - run: |
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/components/PlanTab.tsx
          git commit -m "Restore PlanTab with priority stars" || echo nochange
          git push
