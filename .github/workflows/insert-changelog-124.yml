name: Insert changelog 1.24
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/insert_changelog_124.py'
      - '.github/workflows/insert-changelog-124.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/insert_changelog_124.py
      - run: |
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/types.ts
          git commit -m "chore: in-app CHANGELOG entry for 1.24.0" || echo nochange
          git push
