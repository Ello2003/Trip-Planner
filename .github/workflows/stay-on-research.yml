name: Stay on Research after promote
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stay_on_research.py'
      - '.github/workflows/stay-on-research.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stay_on_research.py
      - run: |
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/App.tsx
          git commit -m "Promote to Plan: keep Research tab focused" || echo nochange
          git push
