name: Restore TripDetailView
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/td.b64'
      - 'scripts/restore_td.py'
      - '.github/workflows/restore-td.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_td.py
      - run: |
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/components/TripDetailView.tsx
          git commit -m "Restore TripDetailView: fix TS so Pages can deploy" || echo nochange
          git push
