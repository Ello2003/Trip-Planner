name: Plan inline stars
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/plan_inline_stars.py'
      - '.github/workflows/plan-inline-stars.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/plan_inline_stars.py
      - run: |
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/components/PlanTab.tsx
          git commit -m "Plan: inline star rating for items without Research priority" || echo nochange
          git push
