name: Update in-app changelog
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_changelog.py'
      - '.github/workflows/update-changelog.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_changelog.py
      - run: |
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/types.ts
          git commit -m "chore: APP_VERSION and in-app CHANGELOG 1.24.0" || echo nochange
          git push
