name: Quick promote to Plan
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/quick_promote.py'
      - '.github/workflows/quick-promote.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/quick_promote.py
      - run: |
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/App.tsx
          git commit -m "App: quick promote to Plan without modal" || echo nochange
          git push
