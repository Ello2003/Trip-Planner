name: Auto bump version on change
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: 'patch, minor, or major'
        default: 'patch'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide whether to bump
        id: decide
        run: |
          set -e
          MSG=$(git log -1 --pretty=%B)
          echo "commit message: $MSG"
          if echo "$MSG" | grep -qiE 'chore: (bump|version)|\[skip version\]|bump to |-> 1\.'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping — version commit"
            exit 0
          fi
          # If this push already changed APP_VERSION, skip
          if git diff HEAD~1 --name-only 2>/dev/null | grep -q 'src/types.ts'; then
            if git diff HEAD~1 -- src/types.ts | grep -q "APP_VERSION"; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Skipping — APP_VERSION already updated in this commit"
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
      - name: Bump patch version
        if: steps.decide.outputs.skip != 'true'
        run: |
          LEVEL="${{ github.event.inputs.level || 'patch' }}"
          NOTES="Auto bump after: $(git log -1 --pretty=%s)"
          python3 scripts/bump_version.py "$LEVEL" "$NOTES"
      - name: Commit version
        if: steps.decide.outputs.skip != 'true'
        run: |
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/types.ts package.json CHANGELOG.md
          VER=$(python3 -c "import re;print(re.search(r\"APP_VERSION = '([^']+)'\", open('src/types.ts').read()).group(1))")
          git commit -m "chore: bump version to ${VER}" || echo nochange
          git push
