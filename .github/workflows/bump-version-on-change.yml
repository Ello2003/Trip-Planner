name: Auto bump version on change
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: 'patch, minor, or major'
        default: 'patch'
      notes:
        description: 'Optional release notes (leave empty to summarise from git)'
        default: ''
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - name: Decide whether to bump
        id: decide
        run: |
          set -e
          MSG=$(git log -1 --pretty=%B)
          echo "commit message: $MSG"
          if echo "$MSG" | grep -qiE 'chore:\s*(bump|version)|\[skip version\]|meaningful version notes|correct .*changelog|tidy .*notes|changelog history'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping — version / history commit"
            exit 0
          fi
          if git diff HEAD~1 --name-only 2>/dev/null | grep -q 'src/types.ts'; then
            if git diff HEAD~1 -- src/types.ts | grep -q "APP_VERSION"; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Skipping — APP_VERSION already updated in this commit"
              exit 0
            fi
          fi
          # Skip pure meta changes (scripts, workflows, markdown only)
          CHANGED=$(git diff HEAD~1 --name-only 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            APP_TOUCHED=$(echo "$CHANGED" | grep -E '^src/' | grep -vE 'types\.ts$' || true)
            if [ -z "$APP_TOUCHED" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Skipping — no app source changes"
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
      - name: Bump version with detailed notes
        if: steps.decide.outputs.skip != 'true'
        run: |
          LEVEL="${{ github.event.inputs.level || 'patch' }}"
          NOTES="${{ github.event.inputs.notes }}"
          if [ -n "$NOTES" ]; then
            python3 scripts/bump_version.py "$LEVEL" "$NOTES"
          else
            python3 scripts/bump_version.py "$LEVEL"
          fi
      - name: Commit version
        if: steps.decide.outputs.skip != 'true'
        run: |
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/types.ts package.json CHANGELOG.md
          VER=$(python3 -c "import re;print(re.search(r\"APP_VERSION = '([^']+)'\", open('src/types.ts').read()).group(1))")
          NOTES=$(python3 -c "import re;m=re.search(r\"'%s':\s*'([^']*)'\" % '$VER', open('src/types.ts').read());print(m.group(1) if m else '')")
          git commit -m "chore: bump version to ${VER}" -m "${NOTES}" || echo nochange
          git push
