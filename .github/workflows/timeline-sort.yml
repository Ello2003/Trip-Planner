name: Timeline sort by time
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/timeline_sort_by_time.py'
      - '.github/workflows/timeline-sort.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/timeline_sort_by_time.py
      - run: |
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/components/PlanTab.tsx src/utils/storage.ts
          git commit -m "Plan timeline: By time vs Manual sort (persist choice)" || echo nochange
          git push
