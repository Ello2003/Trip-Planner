name: Plan section DnD
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/plan_section_dnd.py'
      - '.github/workflows/plan-section-dnd.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/plan_section_dnd.py
      - run: |
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/components/PlanTab.tsx src/components/TripDetailView.tsx
          git commit -m "Plan: drag category sections + quick hide/collapse like Research" || echo nochange
          git push
