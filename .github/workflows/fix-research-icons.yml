name: Fix Research icons
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_icons.py'
      - '.github/workflows/fix-research-icons.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_icons.py
      - run: |
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/components/ResearchTab.tsx
          git commit -m "Icons: Plan-style arrow, pencil, x" || echo nochange
          git push
