name: Fix Research icons
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-research-icons.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch icons
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/components/ResearchTab.tsx')
          t = p.read_text()
          t = t.replace(
              '>to Plan</button>',
              ">{'\u2192 Plan'}</button>",
          )
          t = t.replace('>E</button>', ">{'\u270E'}</button>")
          t = t.replace('>X</button>', ">{'\u2715'}</button>")
          # only replace first X if packing-style - research has Delete title
          p.write_text(t)
          print('patched')
          PY
          # Also fix Packing delete if plain X
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/components/PackingTab.tsx')
          t = p.read_text()
          if ">X</button>" in t:
            t = t.replace(">X</button>", ">{'\u2715'}</button>")
            p.write_text(t)
            print('packing patched')
          PY
          git config user.name "Ello2003"
          git config user.email "graeme.crazydiamond@gmail.com"
          git add src/components/ResearchTab.tsx src/components/PackingTab.tsx
          git commit -m "Icons: Plan-style pencil/x/arrow using JS unicode escapes" || true
          git push
